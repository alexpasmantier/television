[metadata]
name = "pdf-files"
description = "Browse PDF files"
requirements = [["fd", "fdfind"], "pdftotext"]

[source]
command = [
  { name = "Default", run = "$(command -v fd || echo fdfind) -t f -e pdf ." },
  { name = "Hidden",  run = "$(command -v fd || echo fdfind) -t f -e pdf -H ." },
]

[preview]
command = "pdftotext -l 2 -layout '{}' - 2>/dev/null | head -100 || file '{}'"

[ui]
layout = "portrait"

[keybindings]
enter = "actions:open"

[actions.open]
description = "Open the selected PDF with default viewer"
command = "xdg-open {} 2>/dev/null || open {}"
mode = "fork"
