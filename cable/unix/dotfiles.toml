[metadata]
name = "dotfiles"
description = "A channel to select from your user's dotfiles"
requirements = [["fd", "fdfind"], ["bat", "batcat"]]

[source]
command = "$(command -v fd || echo fdfind) -t f . $HOME/.config"

[preview]
command = "$(command -v bat || echo batcat) -n --color=always '{}'"

[keybindings]
enter = "actions:edit"

[actions.edit]
description = "Edit the selected dotfile"
command = "${EDITOR:-vim} {}"
shell = "bash"
mode = "execute"
