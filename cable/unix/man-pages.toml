[metadata]
name = "man-pages"
description = "Browse and preview system manual pages"
requirements = ["apropos", "man"]

[source]
# List all man pages using apropos
command = "apropos ."

[preview]
# Show the man page for the selected entry, in the right section
command = "man {1|replace:s/[(),]//g} '{0}'"
env = { "MANWIDTH" = "80" }

[keybindings]
enter = "actions:open"

[actions.open]
description = "Open the selected man page in the system pager"
command = "man {1|replace:s/[(),]//g} '{0}'"
mode = "execute"

[ui]
layout = "portrait"
preview_panel = { header = "{0}" }
