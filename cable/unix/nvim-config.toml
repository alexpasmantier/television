[metadata]
name = "nvim-config-files"
description = "Search through Neovim configuration files"
requirements = [["fd", "fdfind"], "nvim"]

[source]
command = ["$(command -v fd || echo fdfind) . ~/.config/nvim --type f"]
display = "{regex_extract:.*\\.config/nvim/(.*):1}"

[preview]
command = "$(command -v bat || echo batcat) -n --color=always '{}'"
env = { BAT_THEME = "ansi" }

[keybindings]
shift-enter = "actions:edit"

[actions.edit]
description = "Opens the selected entries with the default editor (falls back to vim)"
command = "${EDITOR:-vim} '{}'"
shell = "bash"
mode = "execute"
